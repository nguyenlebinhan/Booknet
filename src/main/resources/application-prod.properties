# ==============================================================================
# PRODUCTION PROFILE CONFIGURATION (application-prod.properties)
# ==============================================================================

# Datasource configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${BOOKNET_DB_URL}
spring.datasource.username=${BOOKNET_DB_USER}
spring.datasource.password=${BOOKNET_DB_PASS}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Thymeleaf caching (enabled for production performance)
spring.thymeleaf.cache=true

# Logging
logging.level.org.springframework=WARN
logging.level.grp3.java.booknet=INFO
