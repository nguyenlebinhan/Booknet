<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- Library photo panel: ~{authFragments :: aside('photo.jpg', 'First line', 'Second line')} -->
  <aside class="auth-aside" th:fragment="aside(photo, titleFirst, titleSecond)">
    <img class="auth-aside-photo" th:src="@{/images/auth/{name}(name=${photo})}" alt="">
    <div class="auth-aside-overlay"></div>

    <a th:href="@{/}" class="auth-brand" aria-label="booknet Library home">
      <span class="auth-brand-mark">
        <img th:src="@{/images/auth/book-open.svg}" width="24" height="24" alt="">
      </span>
      <span class="auth-brand-text">
        <span class="auth-brand-name">booknet</span>
        <span class="auth-brand-tagline">COMMUNITY LIBRARY</span>
      </span>
    </a>

    <div class="auth-greeting">
      <p class="auth-greeting-title"><span th:text="${titleFirst}">A good book,</span><br><span th:text="${titleSecond}">a fresh beginning.</span></p>
      <p class="auth-greeting-text">Where books bring people together.<br>Welcome to booknet Library.</p>
      <div class="auth-pills">
        <span class="auth-pill">12.000+ titles</span>
        <span class="auth-pill">Open every day</span>
      </div>
    </div>
  </aside>

  <!-- Google sign-in button -->
  <a th:fragment="googleButton" th:href="@{/oauth2/authorization/google}" class="auth-btn auth-btn-google">
    <img th:src="@{/images/auth/google.svg}" width="17" height="17" alt="">
    <span>Continue with Google</span>
  </a>

  <!-- Show / hide password button, placed inside .auth-input-box -->
  <button th:fragment="passwordToggle" type="button" class="auth-password-toggle" aria-label="Show password" aria-pressed="false">
    <img class="auth-eye-off" th:src="@{/images/auth/eye-off.svg}" width="18" height="18" alt="">
    <img class="auth-eye" th:src="@{/images/auth/eye.svg}" width="17" height="17" alt="" hidden>
  </button>

</body>
</html>
