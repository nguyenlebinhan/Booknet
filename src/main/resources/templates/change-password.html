<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password | booknet Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Serif:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<div class="auth-layout">
  <aside th:replace="~{authFragments :: aside('signin-library.jpg', 'A good book,', 'a fresh beginning.')}"></aside>
  <main class="auth-main">
    <div class="auth-content">
      <header class="auth-header">
        <p class="auth-eyebrow">YOUR BOOKNET ACCOUNT</p>
        <h1 class="auth-title auth-title-small">Change password.</h1>
        <p class="auth-subtitle">Update your password to keep your account secure.</p>
      </header>
      <form th:if="${profile.provider.name() == 'LOCAL'}" class="auth-form" th:action="@{/account/change-password}" th:object="${passwordForm}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="auth-notice auth-notice-error" role="alert">
          <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
        </div>
        <div class="auth-fields">
          <div class="auth-field">
            <label for="currentPassword" class="auth-label">Current password</label>
            <div class="auth-input-box">
              <input type="password" id="currentPassword" name="currentPassword" class="auth-input" autocomplete="current-password" maxlength="200" required>
              <button th:replace="~{authFragments :: passwordToggle}"></button>
            </div>
          </div>
          <div class="auth-field">
            <label for="password" class="auth-label">New password</label>
            <div class="auth-input-box">
              <input type="password" id="password" name="newPassword" class="auth-input" autocomplete="new-password" minlength="8" maxlength="32" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).*" required>
              <button th:replace="~{authFragments :: passwordToggle}"></button>
            </div>
            <p class="auth-field-hint">8–32 characters, including uppercase, lowercase and numbers; at most 72 UTF-8 bytes.</p>
          </div>
          <div class="auth-strength" id="password-strength" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="auth-field">
            <label for="confirmPassword" class="auth-label">Confirm new password</label>
            <div class="auth-input-box">
              <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" autocomplete="new-password" required>
              <button th:replace="~{authFragments :: passwordToggle}"></button>
            </div>
          </div>
        </div>
        <div class="auth-actions">
          <button type="submit" class="auth-btn auth-btn-primary">Update password</button>
        </div>
      </form>
      <p th:unless="${profile.provider.name() == 'LOCAL'}" class="auth-notice" role="status">This account uses Google sign-in. Manage your password with Google.</p>
      <a th:href="@{/account/profile}" class="auth-link auth-back">Back to profile</a>
      <a th:href="@{/}" class="auth-link auth-back">Back to home</a>
    </div>
  </main>
</div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
