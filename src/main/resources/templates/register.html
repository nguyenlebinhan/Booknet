<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký thành viên | BookNet - Thư viện Trực tuyến</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <div class="text-center">
        <a th:href="@{/}" href="/" class="brand-logo">
          <div class="brand-icon">
            <i class="bi bi-book-half"></i>
          </div>
          <span class="brand-title">BookNet</span>
        </a>
      </div>

      <div class="auth-header text-center">
        <h1>Đăng ký tài khoản</h1>
        <p>Gia nhập mạng lưới thư viện và mở khóa kho tri thức</p>
      </div>

      <div th:if="${globalError != null}" class="alert-custom-error" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span th:text="${globalError}">Có lỗi xảy ra trong quá trình đăng ký.</span>
      </div>

      <form th:action="@{/register}" th:object="${user}" method="post">
        
        <div class="mb-3">
          <label for="fullName" class="form-label">Họ và tên</label>
          <div class="input-group-custom">
            <i class="bi bi-person input-icon"></i>
            <input type="text" id="fullName" th:field="*{fullName}" 
                   class="form-control-custom" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                   placeholder="Nguyễn Văn A" required>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
            <i class="bi bi-exclamation-circle"></i> Họ và tên không hợp lệ.
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Địa chỉ Email</label>
          <div class="input-group-custom">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" th:field="*{email}" 
                   class="form-control-custom" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                   placeholder="name@example.com" required>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
            <i class="bi bi-exclamation-circle"></i> Email không hợp lệ.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu</label>
          <div class="input-group-custom">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password" id="password" th:field="*{password}" 
                   class="form-control-custom" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                   placeholder="Tối thiểu 6 ký tự" required>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
            <i class="bi bi-exclamation-circle"></i> Mật khẩu không hợp lệ.
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
          <div class="input-group-custom">
            <i class="bi bi-shield-check input-icon"></i>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" 
                   class="form-control-custom" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                   placeholder="Nhập lại mật khẩu" required>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
            <i class="bi bi-exclamation-circle"></i> Mật khẩu xác nhận không khớp.
          </div>
        </div>

        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" id="termsAccepted">
            <label class="form-check-label" for="termsAccepted">
              Tôi đồng ý với <a href="#" target="_blank">Điều khoản sử dụng</a> và <a href="#" target="_blank">Quy chế mượn trả</a> của BookNet.
            </label>
          </div>
          <div class="field-error" th:if="${#fields.hasErrors('termsAccepted')}" th:errors="*{termsAccepted}">
            <i class="bi bi-exclamation-circle"></i> Bạn cần đồng ý với điều khoản.
          </div>
        </div>

        <button type="submit" class="btn btn-submit">
          <span>Tạo tài khoản</span>
          <i class="bi bi-check2-circle ms-2"></i>
        </button>

      </form>

      <div class="auth-footer">
        Đã có tài khoản thư viện? 
        <a th:href="@{/login}" href="/login">Đăng nhập ngay</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
