<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | BookNet - Thư viện Trực tuyến</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <div class="text-center">
        <a th:href="@{/}" href="/" class="brand-logo">
          <div class="brand-icon">
            <i class="bi bi-book-half"></i>
          </div>
          <span class="brand-title">BookNet</span>
        </a>
      </div>

      <div class="auth-header text-center">
        <h1>Chào mừng trở lại!</h1>
        <p>Đăng nhập vào tài khoản thư viện của bạn</p>
      </div>

      <div th:if="${errorMessage != null}" class="alert-custom-error" role="alert">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span th:text="${errorMessage}">Email hoặc mật khẩu không chính xác.</span>
      </div>

      <div th:if="${successMessage != null}" class="alert-custom-success" role="alert">
        <i class="bi bi-check-circle-fill flex-shrink-0"></i>
        <span th:text="${successMessage}">Đăng ký thành công! Hãy đăng nhập.</span>
      </div>

      <div th:if="${logoutMessage != null}" class="alert-custom-info" role="alert">
        <i class="bi bi-info-circle-fill flex-shrink-0"></i>
        <span th:text="${logoutMessage}">Bạn đã đăng xuất thành công.</span>
      </div>

      <a th:href="@{/oauth2/authorization/google}" href="/oauth2/authorization/google" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Tiếp tục với Google</span>
      </a>

      <div class="auth-divider">
        <span>Hoặc dùng Email</span>
      </div>

      <form th:action="@{/login}" method="post">
        
        <div class="mb-3">
          <label for="email" class="form-label">Địa chỉ Email</label>
          <div class="input-group-custom">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" name="email" class="form-control-custom" placeholder="name@example.com" required autofocus>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label mb-0">Mật khẩu</label>
          </div>
          <div class="input-group-custom">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password" id="password" name="password" class="form-control-custom" placeholder="Nhập mật khẩu..." required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Ghi nhớ đăng nhập
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-submit">
          <span>Đăng nhập</span>
          <i class="bi bi-arrow-right ms-2"></i>
        </button>

      </form>

      <div class="auth-footer">
        Chưa có tài khoản độc giả? 
        <a th:href="@{/register}" href="/register">Đăng ký ngay</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
