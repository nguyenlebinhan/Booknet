# ==============================================================================
# LOCAL PROFILE CONFIGURATION (application-local.properties)
# ==============================================================================

# Datasource configuration (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${BOOKNET_DB_URL}
spring.datasource.username=${BOOKNET_DB_USER}
spring.datasource.password=${BOOKNET_DB_PASS}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Thymeleaf caching (disabled for quick local UI reload)
spring.thymeleaf.cache=false
