<dialog class="author-photo-lightbox" aria-label="Full-size author photo"
        data-author-photo-dialog th:fragment="authorPhotoDialog">
  <button class="author-photo-lightbox-close" type="button" aria-label="Close photo" data-author-photo-close>
    <span aria-hidden="true">&times;</span>
  </button>
  <img class="author-photo-lightbox-image" src="" alt="" data-author-photo-image>
</dialog>
