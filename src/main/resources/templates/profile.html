<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile | booknet Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Noto+Serif:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<div class="auth-layout">
  <aside th:replace="~{authFragments :: aside('register-library.jpg', 'Every reader,', 'a story of their own.')}"></aside>
  <main class="auth-main">
    <div class="auth-content">
      <header class="auth-header">
        <p class="auth-eyebrow">YOUR BOOKNET ACCOUNT</p>
        <h1 class="auth-title auth-title-small">My profile.</h1>
        <p class="auth-subtitle" th:text="${profile.email}">reader@example.com</p>
      </header>
      <div th:if="${successMessage != null}" th:text="${successMessage}" class="auth-notice auth-notice-success" role="status"></div>
      <form class="auth-form" th:action="@{/account/profile}" th:object="${profileForm}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="auth-notice auth-notice-error" role="alert">
          <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
        </div>
        <div class="auth-fields">
          <div class="auth-field">
            <label for="fullName" class="auth-label">Full name *</label>
            <div class="auth-input-box" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error'">
              <input type="text" th:field="*{fullName}" class="auth-input" autocomplete="name" minlength="2" maxlength="120" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="phone" class="auth-label">Phone number</label>
            <div class="auth-input-box" th:classappend="${#fields.hasErrors('phone')} ? 'has-error'">
              <input type="tel" th:field="*{phone}" class="auth-input" autocomplete="tel" maxlength="20">
            </div>
          </div>
          <div class="auth-field">
            <label for="address" class="auth-label">Address</label>
            <div class="auth-input-box" th:classappend="${#fields.hasErrors('address')} ? 'has-error'">
              <input type="text" th:field="*{address}" class="auth-input" autocomplete="street-address" maxlength="255">
            </div>
          </div>
          <div class="auth-field">
            <label for="avatarUrl" class="auth-label">Avatar URL</label>
            <div class="auth-input-box" th:classappend="${#fields.hasErrors('avatarUrl')} ? 'has-error'">
              <input type="url" th:field="*{avatarUrl}" class="auth-input" placeholder="https://example.com/avatar.png" maxlength="500">
            </div>
          </div>
        </div>
        <div class="auth-actions">
          <button type="submit" class="auth-btn auth-btn-primary">Save profile</button>
        </div>
      </form>
      <a th:if="${profile.provider.name() == 'LOCAL'}" th:href="@{/account/change-password}" class="auth-link">Change password</a>
      <a th:href="@{/}" class="auth-link auth-back">Back to home</a>
    </div>
  </main>
</div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
