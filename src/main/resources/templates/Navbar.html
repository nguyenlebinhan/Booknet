<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <!-- Include with: <header th:replace="~{Navbar :: navbar}"></header> -->
  <header class="bn-navbar" id="booknet-navbar" th:fragment="navbar">

    <a th:href="@{/}" class="bn-brand" aria-label="booknet Library home">
      <span class="bn-brand-mark">
        <img th:src="@{/images/home/nav-book-open.svg}" width="24" height="24" alt="">
      </span>
      <span class="bn-brand-text">
        <span class="bn-brand-name">booknet</span>
        <span class="bn-brand-tagline">COMMUNITY LIBRARY</span>
      </span>
    </a>

    <nav aria-label="Main navigation">
      <ul class="bn-nav-links" id="bn-nav-links">
        <li><a th:href="@{/catalog}" href="/catalog" class="bn-nav-link" th:classappend="${activePage == 'catalog'} ? ' is-active' : ''">Explore books</a></li>
        <li><a th:href="@{/about}" href="/about" class="bn-nav-link" th:classappend="${activePage == 'about'} ? ' is-active' : ''">About the library</a></li>
        <li><a th:href="@{/contact}" href="/contact" class="bn-nav-link" th:classappend="${activePage == 'contact'} ? ' is-active' : ''">Contact</a></li>
        <li sec:authorize="isAuthenticated()"><a href="#" class="bn-nav-link">My books</a></li>
        <li sec:authorize="isAuthenticated()"><a href="#" class="bn-nav-link">Reservations</a></li>
      </ul>
    </nav>

    <div class="bn-account" sec:authorize="isAnonymous()">
      <a th:href="@{/login}" class="bn-signin">Sign in</a>
      <a th:href="@{/register}" class="bn-register">Member registration</a>
    </div>

    <div class="bn-account" sec:authorize="isAuthenticated()">
      <a href="#" class="bn-bell" aria-label="Notifications">
        <img th:src="@{/images/home/bell.svg}" width="20" height="20" alt="">
      </a>
      <span class="bn-account-divider"></span>
      <div class="bn-user">
        <button type="button" class="bn-user-button" id="bn-user-button" aria-expanded="false" aria-controls="bn-user-menu">
          <span class="bn-avatar" th:with="uname=${#authentication.name}" th:text="${#strings.length(uname) > 0 ? #strings.toUpperCase(#strings.substring(uname, 0, 1)) : 'U'}">U</span>
          <span class="bn-user-name" sec:authentication="name">User</span>
          <img th:src="@{/images/home/chevron-down.svg}" width="15" height="15" alt="">
        </button>
        <div class="bn-user-menu" id="bn-user-menu" hidden>
          <form th:action="@{/logout}" method="post">
            <button type="submit">Sign out</button>
          </form>
        </div>
      </div>
    </div>

    <button type="button" class="bn-menu-toggle" id="bn-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="bn-nav-links">
      <span></span><span></span><span></span>
    </button>

    <script>
      (function () {
        const bindToggle = (buttonId, onToggle) => {
          const button = document.getElementById(buttonId);
          if (button) {
            button.addEventListener('click', () => {
              button.setAttribute('aria-expanded', onToggle());
            });
          }
        };

        // 1. Mobile menu
        const links = document.getElementById('bn-nav-links');
        bindToggle('bn-menu-toggle', () => links.classList.toggle('open'));

        // 2. Account menu
        const menu = document.getElementById('bn-user-menu');
        bindToggle('bn-user-button', () => {
          menu.hidden = !menu.hidden;
          return !menu.hidden;
        });
      })();
    </script>
  </header>

</body>
</html>
