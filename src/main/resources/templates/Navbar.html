<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNet Navbar Component</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Navbar Stylesheet -->
  <link rel="stylesheet" th:href="@{/css/navbar.css}" href="/css/navbar.css">
  
  <style>
    /* Demo preview styles when viewing Navbar.html standalone */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.08) 0%, transparent 45%),
                  #0a0e1a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #f8fafc;
    }

    .demo-content {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ===================================================================
       THYMELEAF NAVBAR FRAGMENT: th:fragment="navbar"
       Can be included in any template with:
       <div th:replace="~{Navbar :: navbar}"></div>
       or
       <header th:replace="~{Navbar :: navbar}"></header>
       =================================================================== -->
  <header class="bn-navbar" id="booknet-navbar" th:fragment="navbar">
    <div class="bn-navbar-container">
      
      <!-- 1. BRAND / LOGO (Left) -->
      <a th:href="@{/}" href="/" class="bn-logo" id="bn-site-logo" aria-label="BookNet Home">
        <div class="bn-logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <circle cx="12" cy="10" r="2.5"></circle>
          </svg>
        </div>
        <span class="bn-logo-text">BookNet</span>
        <span class="bn-logo-badge">Library</span>
      </a>

      <!-- 2. NAVIGATION LINKS (Center) -->
      <nav aria-label="Main Navigation">
        <ul class="bn-nav-menu" id="bn-nav-links">
          <li>
            <a th:href="@{/}" href="/" class="bn-nav-link active" id="bn-nav-home">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a th:href="@{/catalog}" href="#catalog" class="bn-nav-link" id="bn-nav-catalog">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
              <span>Catalog</span>
            </a>
          </li>
          <li>
            <a th:href="@{/services}" href="#services" class="bn-nav-link" id="bn-nav-services">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
              </svg>
              <span>Services</span>
            </a>
          </li>
          <li>
            <a th:href="@{/about}" href="#about" class="bn-nav-link" id="bn-nav-about">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span>About</span>
            </a>
          </li>
          <li>
            <a th:href="@{/contact}" href="#contact" class="bn-nav-link" id="bn-nav-contact">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <span>Contact</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 3. ACTIONS: Quick Search, Theme Toggle, Auth Button / User Profile (Right) -->
      <div class="bn-nav-actions">
        
        <!-- Quick Search Bar -->
        <form th:action="@{/search}" method="get" class="bn-search-box" id="bn-quick-search-form">
          <svg class="bn-search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" name="keyword" class="bn-search-input" id="bn-search-keyword" placeholder="Search books, ISBN..." aria-label="Search books">
        </form>

        <div class="bn-user-badge" id="bn-user-profile" sec:authorize="isAuthenticated()">
          <div class="bn-user-avatar" id="bn-user-avatar-initials">
            <span th:with="uname=${#authentication.name}" th:text="${#strings.length(uname) > 0 ? #strings.toUpperCase(#strings.substring(uname, 0, 1)) : 'U'}">U</span>
          </div>
          <div class="bn-user-info">
            <span class="bn-user-name" id="bn-user-fullname" sec:authentication="name">User</span>
            <span class="bn-user-role" id="bn-user-role" sec:authorize="hasRole('ADMIN')">Admin</span>
            <span class="bn-user-role" id="bn-user-role-member" sec:authorize="!hasRole('ADMIN')">Member</span>
          </div>
          <form th:action="@{/logout}" method="post" style="display:inline; margin:0; padding:0;">
            <button type="submit" class="bn-btn-logout" id="bn-logout-link" title="Đăng xuất" aria-label="Sign out" style="background:none; border:none; cursor:pointer; color:inherit; display:flex; align-items:center;">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
            </button>
          </form>
        </div>

        <a th:href="@{/login}" href="/login" class="bn-btn-auth" id="bn-login-btn" sec:authorize="isAnonymous()">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Sign In</span>
        </a>

        <!-- Mobile Menu Hamburger Button -->
        <button type="button" class="bn-hamburger" id="bn-hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>

    <!-- Interactive JavaScript for Navbar functionality -->
    <script>
      (function () {
        // Enforce dark theme
        document.documentElement.setAttribute('data-theme', 'dark');

        // 1. Sticky Navbar shadow on scroll
        const navbar = document.getElementById('booknet-navbar');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 20) {
            navbar?.classList.add('scrolled');
          } else {
            navbar?.classList.remove('scrolled');
          }
        });

        // 2. Mobile Menu Toggle
        const hamburger = document.getElementById('bn-hamburger-btn');
        const navMenu = document.getElementById('bn-nav-links');
        if (hamburger && navMenu) {
          hamburger.addEventListener('click', () => {
            const isOpen = hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
            hamburger.setAttribute('aria-expanded', isOpen);
          });

          // Close mobile menu when clicking outside or clicking any link
          document.querySelectorAll('.bn-nav-link').forEach(link => {
            link.addEventListener('click', () => {
              hamburger.classList.remove('active');
              navMenu.classList.remove('active');
              hamburger.setAttribute('aria-expanded', 'false');
            });
          });
        }
      })();
    </script>
  </header>

  <!-- Demo Content (visible only when previewing Navbar.html directly) -->
  <main class="demo-content">
    <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; background: linear-gradient(135deg, #fff, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      BookNet Navigation Bar Component
    </h1>
    <p style="color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px;">
      Modern Glassmorphic Navbar component with Dark/Light mode support, smooth navigation, and full Thymeleaf compatibility.
    </p>
  </main>
</body>
</html>
