spring.application.name=Booknet

# Account email delivery. Use an SMTP server (for example Mailpit locally).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.account.base-url=${APP_BASE_URL:http://localhost:8080}
app.account.mail-from=${MAIL_FROM:no-reply@booknet.local}

# ==============================================================================
# 1. ENVIRONMENT CONFIGURATION IMPORT
# ==============================================================================
# Import .env if available (root dir and parent dir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Active profile (default to local if not specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server port
server.port=${PORT:8080}

# ==============================================================================
# 2. THYMELEAF & WEB CONFIGURATION
# ==============================================================================
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/


# ==============================================================================
# 3. LOGGING CONFIGURATION
# ==============================================================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.grp3.java.booknet=DEBUG

# ==============================================================================
# 4. OAUTH2 CONFIGURATION (Google)
# ==============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
