spring.application.name=Booknet

# ==============================================================================
# 1. ENVIRONMENT CONFIGURATION IMPORT
# ==============================================================================
# Import .env if available (root dir and parent dir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Active profile (default to local if not specified)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server port
server.port=${PORT:8080}

# ==============================================================================
# 2. THYMELEAF & WEB CONFIGURATION
# ==============================================================================
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/


# ==============================================================================
# 3. LOGGING CONFIGURATION
# ==============================================================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.grp3.java.booknet=DEBUG
