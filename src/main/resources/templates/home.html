<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNet - Home</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" th:href="@{/css/navbar.css}" href="/css/navbar.css">
  <link rel="stylesheet" th:href="@{/css/home.css}" href="/css/home.css">
  <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
</head>

<body>

  <!-- ===================================================================
       NAVBAR COMPONENT INCLUSION (Thymeleaf fragment from Navbar.html)
       =================================================================== -->
  <header th:replace="~{Navbar :: navbar}"></header>

  <!-- ===================================================================
       MAIN CONTENT (Clean Home Page Placeholder)
       =================================================================== -->
  <main class="home-main">
    <div class="empty-state-box">
      <div class="empty-state-icon">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </div>
      <h2 class="empty-state-title">Welcome to BookNet</h2>
      <p class="empty-state-desc">
        The home page content area is currently blank and ready for new components, such as hero banners, featured
        books, library services, and announcements.
      </p>
    </div>
  </main>

  <footer th:replace="~{Footer :: footer-section}"></footer>

</body>

</html>
